apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: prod-auth-ratelimit@kubernetescrd
spec:
  rules:
    - host: lagrangefi.ai-bob.pro
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
  tls:
    - hosts:
        - lagrangefi.ai-bob.pro
      secretName: auth-tls
