# Per-IP rate limit on /auth/* (login + register).
# average=5 req/s sustained, burst=10 — generous for legit users, tight enough to
# slow credential-stuffing from thousands/s to single-digits/s per source IP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-ratelimit
spec:
  rateLimit:
    average: 5
    burst: 10
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
